# p0-monitoring — one file, two roles.
#
#   on the machine that controls everything:   docker compose --profile hub up -d --build
#   on every machine you want to measure:      HUB=http://<hub-ip>:8000 docker compose up -d --build
#
# The five services without a profile run everywhere: four of them must sit beside what
# they measure, because they read the local kernel. Prometheus and Grafana only exist on
# the hub. The hub measures itself through the same five, so it is simply the machine
# that also holds the control plane.
#
# STATE. Everything the app knows is one readable file, and it lands in ./data next to
# this compose by default — somewhere you can see it, copy it and back it up. It used to
# be /opt/p0-monitoring, which on Docker Desktop is not on your machine at all: it is
# inside Docker's own virtual machine, invisible from the host and gone the moment that
# VM is reset. Set DATA_PATH to put it elsewhere.
#
# METRICS go in ./data too, so that EVERYTHING this app keeps is in one folder you can
# see, copy and back up. The textbook answer is a named Docker volume, because a time
# series database is many small files and a bind mount is slower — but that is an argument
# about millions of series, and a handful of machines is a few hundred. Meanwhile a volume
# lives wherever Docker keeps them, which on Docker Desktop is inside a virtual machine
# that an update or a backend switch can replace, and neither feels destructive at the
# time. On a large Linux install the trade-off flips back: PROMETHEUS_DATA and GRAFANA_DATA
# take a volume name instead of a path.
#
# PORTS. Every published port can be moved, for machines that already have something on
# one of these. Put it in a .env file next to this one, or in the environment:
#
#   GRAFANA_PORT=3300 docker compose --profile hub up -d --build
#
# Only the HOST side moves; inside the network the ports never change, so a hub keeps
# scraping its own collectors by service name regardless. If you move a port on a NODE,
# tell the hub on its Machines screen, or it will keep scraping the old one.
name: p0-monitoring

services:

  # The app. On the hub it serves the wizard and the configuration; on a node it fetches
  # that configuration and applies it locally. Either way it publishes this machine's
  # inventory on /metrics.
  app:
    build: ./app
    container_name: p0m-app
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # discover containers, restart the prober
      - /sys:/host/sys:ro                           # capability detection: RAPL, cgroups
      - ${DATA_PATH:-./data}:/data                  # state and generated configuration
      # Where the state used to be. Read-only, and only so that an install made before
      # it moved is picked up and carried over instead of silently coming up blank.
      - ${LEGACY_DATA_PATH:-/opt/p0-monitoring}:/legacy:ro
      # Where the metrics used to be, for the same reason: an install made before they
      # moved has history in here, and leaving it behind without a word is the one thing
      # this app is not allowed to do. Read-only, and the status page says if it is used.
      - prometheus-data:/legacy-metrics:ro
    environment:
      HUB: ${HUB:-}          # unset = this machine is the hub
      # what this machine publishes, so the app can link to it and tell a hub about it
      APP_PORT: ${APP_PORT:-8000}
      CADVISOR_PORT: ${CADVISOR_PORT:-8080}
      NODE_EXPORTER_PORT: ${NODE_EXPORTER_PORT:-9100}
      KEPLER_PORT: ${KEPLER_PORT:-9102}
      CLOUDPROBER_PORT: ${CLOUDPROBER_PORT:-9313}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9090}
      GRAFANA_PORT: ${GRAFANA_PORT:-3000}
      # Passed in so the app knows whether the metrics were pointed at a directory, and
      # can give it the ownership those two need before they start. A volume name here
      # means there is nothing to prepare.
      PROMETHEUS_DATA: ${PROMETHEUS_DATA:-./data/prometheus}
      GRAFANA_DATA: ${GRAFANA_DATA:-./data/grafana}
    ports:
      - "${APP_PORT:-8000}:8000"
      # A cluster made with kind, k3d or minikube binds its API server to loopback on
      # the machine that made it, so from anywhere else it does not exist. When that
      # machine runs a node, the hub asks the node to publish it, and it comes out here.
      # Four, because a machine can hold more than one cluster and there is no reason to
      # make the second one a special case.
      - "${CLUSTER_PORTS:-6443-6446}:6443-6446"

  # CPU, memory, limits and container labels. Must be local: reads the cgroupfs.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1   # v0.49.1 does NOT work with Docker >=29
    container_name: p0m-cadvisor
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg:/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only=true
      - --store_container_labels=false
      # Fixed on purpose: no dashboard query uses arbitrary Docker labels, so only the
      # three Compose ones are needed. That is what lets this file stay static.
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,com.docker.compose.container-number
      - --disable_metrics=percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl
      - --housekeeping_interval=10s
    ports: ["${CADVISOR_PORT:-8080}:8080"]

  # The machine itself: CPU, RAM, disk, network, pressure.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: p0m-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.pressure
    ports: ["${NODE_EXPORTER_PORT:-9100}:9100"]

  # Energy. Real measurement where RAPL exists, a modelled estimate where it does not —
  # the app tells you which before anything is installed.
  kepler:
    image: quay.io/sustainable_computing_io/kepler:release-0.8.0
    container_name: p0m-kepler
    restart: unless-stopped
    privileged: true
    pid: host
    volumes:
      - /lib/modules:/lib/modules:ro
      - /sys:/sys
      - /proc:/proc
      - /usr/src:/usr/src:ro
    environment:
      BIND_ADDRESS: 0.0.0.0:9102
      CGROUP_METRICS: "*"
      ENABLE_EBPF_CGROUPID: "true"
      ENABLE_GPU: "false"
      ENABLE_PROCESS_METRICS: "false"
      EXPOSE_CGROUP_METRICS: "false"
      EXPOSE_HW_COUNTER_METRICS: "true"
    command: ["/usr/bin/kepler", "-v=1"]
    ports: ["${KEPLER_PORT:-9102}:9102"]

  # Quality of service, probed from outside the target. Local because containers expose
  # ports on their own Docker network without publishing them to the host.
  cloudprober:
    image: cloudprober/cloudprober:latest
    container_name: p0m-cloudprober
    restart: unless-stopped
    # The DIRECTORY is mounted, not the file: a single-file bind mount keeps following
    # the old inode when the app rewrites it.
    volumes:
      - ${DATA_PATH:-./data}/generated:/etc/cloudprober:ro
    command: ["--config_file=/etc/cloudprober/cloudprober.cfg"]
    ports: ["${CLOUDPROBER_PORT:-9313}:9313"]

  # ------------------------------------------------------------------ hub only
  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: p0m-prometheus
    profiles: ["hub"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy   # the app writes prometheus.yml before this starts
    volumes:
      - ${DATA_PATH:-./data}/generated:/etc/prometheus:ro
      - ${PROMETHEUS_DATA:-./data/prometheus}:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    image: grafana/grafana:11.5.2
    container_name: p0m-grafana
    profiles: ["hub"]
    restart: unless-stopped
    depends_on: [prometheus]
    volumes:
      - ${DATA_PATH:-./data}/generated/grafana:/etc/grafana/provisioning:ro
      - ${GRAFANA_DATA:-./data/grafana}:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports: ["${GRAFANA_PORT:-3000}:3000"]

volumes:
  prometheus-data:
  grafana-data:
