# p0-monitoring — one file, two roles.
#
#   on the machine that controls everything:   docker compose --profile hub up -d --build
#   on every machine you want to measure:      HUB=http://<hub-ip>:8000 docker compose up -d --build
#
# The five services without a profile run everywhere: four of them must sit beside what
# they measure, because they read the local kernel. Prometheus and Grafana only exist on
# the hub. The hub measures itself through the same five, so it is simply the machine
# that also holds the control plane.
#
# PORTS. Every published port can be moved, for machines that already have something on
# one of these. Put it in a .env file next to this one, or in the environment:
#
#   GRAFANA_PORT=3300 docker compose --profile hub up -d --build
#
# Only the HOST side moves; inside the network the ports never change, so a hub keeps
# scraping its own collectors by service name regardless. If you move a port on a NODE,
# tell the hub on its Machines screen, or it will keep scraping the old one.
name: p0-monitoring

services:

  # The app. On the hub it serves the wizard and the configuration; on a node it fetches
  # that configuration and applies it locally. Either way it publishes this machine's
  # inventory on /metrics.
  app:
    build: ./app
    container_name: p0m-app
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # discover containers, restart the prober
      - /sys:/host/sys:ro                           # capability detection: RAPL, cgroups
      - /opt/p0-monitoring:/data                    # state and generated configuration
    environment:
      HUB: ${HUB:-}          # unset = this machine is the hub
      # what this machine publishes, so the app can link to it and tell a hub about it
      APP_PORT: ${APP_PORT:-8000}
      CADVISOR_PORT: ${CADVISOR_PORT:-8080}
      NODE_EXPORTER_PORT: ${NODE_EXPORTER_PORT:-9100}
      KEPLER_PORT: ${KEPLER_PORT:-9102}
      CLOUDPROBER_PORT: ${CLOUDPROBER_PORT:-9313}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9090}
      GRAFANA_PORT: ${GRAFANA_PORT:-3000}
    ports: ["${APP_PORT:-8000}:8000"]

  # CPU, memory, limits and container labels. Must be local: reads the cgroupfs.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1   # v0.49.1 does NOT work with Docker >=29
    container_name: p0m-cadvisor
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg:/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only=true
      - --store_container_labels=false
      # Fixed on purpose: no dashboard query uses arbitrary Docker labels, so only the
      # three Compose ones are needed. That is what lets this file stay static.
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,com.docker.compose.container-number
      - --disable_metrics=percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl
      - --housekeeping_interval=10s
    ports: ["${CADVISOR_PORT:-8080}:8080"]

  # The machine itself: CPU, RAM, disk, network, pressure.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: p0m-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.pressure
    ports: ["${NODE_EXPORTER_PORT:-9100}:9100"]

  # Energy. Real measurement where RAPL exists, a modelled estimate where it does not —
  # the app tells you which before anything is installed.
  kepler:
    image: quay.io/sustainable_computing_io/kepler:release-0.8.0
    container_name: p0m-kepler
    restart: unless-stopped
    privileged: true
    pid: host
    volumes:
      - /lib/modules:/lib/modules:ro
      - /sys:/sys
      - /proc:/proc
      - /usr/src:/usr/src:ro
    environment:
      BIND_ADDRESS: 0.0.0.0:9102
      CGROUP_METRICS: "*"
      ENABLE_EBPF_CGROUPID: "true"
      ENABLE_GPU: "false"
      ENABLE_PROCESS_METRICS: "false"
      EXPOSE_CGROUP_METRICS: "false"
      EXPOSE_HW_COUNTER_METRICS: "true"
    command: ["/usr/bin/kepler", "-v=1"]
    ports: ["${KEPLER_PORT:-9102}:9102"]

  # Quality of service, probed from outside the target. Local because containers expose
  # ports on their own Docker network without publishing them to the host.
  cloudprober:
    image: cloudprober/cloudprober:latest
    container_name: p0m-cloudprober
    restart: unless-stopped
    # The DIRECTORY is mounted, not the file: a single-file bind mount keeps following
    # the old inode when the app rewrites it.
    volumes:
      - /opt/p0-monitoring/generated:/etc/cloudprober:ro
    command: ["--config_file=/etc/cloudprober/cloudprober.cfg"]
    ports: ["${CLOUDPROBER_PORT:-9313}:9313"]

  # ------------------------------------------------------------------ hub only
  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: p0m-prometheus
    profiles: ["hub"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy   # the app writes prometheus.yml before this starts
    volumes:
      - /opt/p0-monitoring/generated:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    image: grafana/grafana:11.5.2
    container_name: p0m-grafana
    profiles: ["hub"]
    restart: unless-stopped
    depends_on: [prometheus]
    volumes:
      - /opt/p0-monitoring/generated/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports: ["${GRAFANA_PORT:-3000}:3000"]

volumes:
  prometheus-data:
  grafana-data:
